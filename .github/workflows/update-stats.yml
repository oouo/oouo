name: Update GitHub stats

# Maintenance guide: docs/stats-maintenance.md

on:
  schedule:
    - cron: "8 0 * * *" # 08:08 Asia/Shanghai, lucky and away from the top-of-hour peak
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-github-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Keep scheduled workflow active
        shell: bash
        run: |
          set -euo pipefail

          # Run before fetching cards: service failures must not cause 60 days of inactivity.
          last_commit_time="$(git log -1 --format=%ct)"
          current_time="$(date +%s)"
          if (( current_time - last_commit_time < 30 * 86400 )); then
            echo "Repository activity is recent; no keepalive commit needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep stats workflow active"
          git push

      - name: Download and validate stats cards
        shell: bash
        env:
          STATS_ENDPOINT: https://github-readme-stats.uuuuo.com/api
        run: |
          set -euo pipefail

          stats_tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$stats_tmp_dir"' EXIT

          fetch_card() {
            local theme="$1"
            local filename="$2"
            local card_path="${stats_tmp_dir}/${filename}"
            local stats_url="${STATS_ENDPOINT}?username=oouo&show_icons=true&hide_border=true&border_radius=8&theme=${theme}&include_all_commits=true&rank_icon=github&disable_animations=true"
            local content_type

            content_type="$(curl \
              --fail \
              --show-error \
              --silent \
              --location \
              --retry 3 \
              --retry-delay 2 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 30 \
              --output "$card_path" \
              --write-out '%{content_type}' \
              "$stats_url")"

            if [[ "$content_type" != image/svg+xml* ]]; then
              echo "Unexpected content type for ${theme} stats card" >&2
              return 1
            fi

            # The service returns error SVGs with HTTP 200, often below the size limit.
            if grep -Eiq 'Something went wrong|Maximum retries exceeded|rate limit|Resource not accessible|Bad credentials' "$card_path"; then
              python3 - "$card_path" "$theme" <<'PY'
          import html
          import os
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          message = " ".join(" ".join(node.itertext()) for node in root.iter("{http://www.w3.org/2000/svg}text"))
          detail = f"Stats service returned an error card for {sys.argv[2]}: {message}"
          hint = ""
          if "personal access token" in message.lower() or "bad credentials" in message.lower():
              hint = "Check the Vercel service PAT_1 permissions and validity; this is separate from the workflow GITHUB_TOKEN."
          print(detail, file=sys.stderr)
          if hint:
              print(hint, file=sys.stderr)
          if summary := os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(summary, "a", encoding="utf-8") as output:
                  output.write(f"### Stats refresh failed\n\n<pre>{html.escape(detail)}</pre>\n\n{hint}\n\nThe existing card pair was preserved.\n")
          PY
              return 1
            fi

            if (( $(wc -c < "$card_path") < 1000 )); then
              echo "Stats card for ${theme} is unexpectedly small" >&2
              return 1
            fi

            python3 -c 'import pathlib, sys; path = pathlib.Path(sys.argv[1]); text = path.read_text(encoding="utf-8"); path.write_text("\n".join(line.rstrip() for line in text.splitlines()).rstrip() + "\n", encoding="utf-8")' "$card_path"

            if ! python3 -c 'import sys, xml.etree.ElementTree as ET; root = ET.parse(sys.argv[1]).getroot(); raise SystemExit(root.tag != "{http://www.w3.org/2000/svg}svg")' "$card_path"; then
              echo "Stats card for ${theme} is not a complete SVG" >&2
              return 1
            fi

            for stats_field in stars commits prs issues contribs; do
              if ! grep -q "data-testid=\"${stats_field}\"" "$card_path"; then
                echo "Stats card for ${theme} is missing ${stats_field}" >&2
                return 1
              fi
            done

            if grep -Eiq '<script|<foreignObject|([[:space:]]|<)on[a-z]+[[:space:]]*=' "$card_path"; then
              echo "Stats card for ${theme} contains unsafe SVG content" >&2
              return 1
            fi
          }

          fetch_card tokyonight github-stats-dark.svg
          fetch_card default github-stats-light.svg

          install -m 0644 "$stats_tmp_dir/github-stats-dark.svg" assets/github-stats-dark.svg
          install -m 0644 "$stats_tmp_dir/github-stats-light.svg" assets/github-stats-light.svg

      - name: Commit updated cards
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- assets/github-stats-dark.svg assets/github-stats-light.svg; then
            echo "Stats cards are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/github-stats-dark.svg assets/github-stats-light.svg
          git commit -m "chore: update GitHub stats cards"
          git push
